schema_version: 1

context:
  name: gcloud-aio-pubsub
  version: 6.3.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gcloud_aio_pubsub-${{ version }}.tar.gz
  sha256: 6af619459abf2115ba3fff4f8cdc9213c5e3b59467c77435a2aeaadb39577588

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - gcloud-aio-auth >=3.3.0,<6.0.0
    - prometheus_client >=0.13.1,<1.0.0

tests:
  - python:
      imports:
        - gcloud.aio.pubsub
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Python Client for Google Cloud Pub/Sub
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/talkiq/gcloud-aio

extra:
  recipe-maintainers:
    - xylar
