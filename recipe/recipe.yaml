schema_version: 1

context:
  name: gcloud-aio-pubsub
  version: "7.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gcloud_aio_pubsub-${{ version }}.tar.gz
  sha256: 469c965a3031ceef7e4fe8426f5ca61565942836d3dd0b3537977508e3b204a1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }},<4.0
    - gcloud-aio-auth >=3.3.0,<6.0.0
    - prometheus_client >=0.13.1,<1.0.0

tests:
  - python:
      imports:
        - gcloud.aio.pubsub
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Python Client for Google Cloud Pub/Sub
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/talkiq/gcloud-aio

extra:
  recipe-maintainers:
    - xylar
